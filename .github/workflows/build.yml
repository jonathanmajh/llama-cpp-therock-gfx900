name: Build and publish llama.cpp image

on:
  schedule:
    - cron: '0 3 * * 5'   # daily at 03:00 UTC
  workflow_dispatch: {}    # lets you trigger it manually too

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout this repo (just the Dockerfile)
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          build-args: |
            CACHEBUST=${{ github.run_id }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/llama-cpp:latest
            ghcr.io/${{ github.repository_owner }}/llama-cpp:${{ github.run_number }}